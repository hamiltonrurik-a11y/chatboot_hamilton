type: object
properties:
  updated_at_usec:
    type: integer
    format: int64
    description: Update timestamp in Unix microseconds, used to reject stale realtime events. Existing updated_at remains Unix seconds.
  id:
    type: number
    description: The ID of the pipeline item
  title:
    type:
      - string
      - 'null'
    description: The title of the item (card)
  value:
    type:
      - string
      - 'null'
    description: >
      The monetary value associated with this deal. Serialized as a string, not a number: the
      column is decimal(15,2) and Jbuilder renders BigDecimal as a string to avoid the float
      rounding a JSON number would introduce.
  notes:
    type:
      - string
      - 'null'
    description: Additional notes about the item
  position:
    type: number
    description: The display order position within the stage
  pipeline_stage_id:
    type: number
    description: The ID of the stage this item belongs to
  pipeline_stage_name:
    type: string
    description: The name of the stage this item belongs to
  pipeline_id:
    type: number
    description: The ID of the pipeline this item belongs to, resolved through its stage
  pipeline_name:
    type: string
    description: The name of the pipeline this item belongs to
  pipeline_lost_reason_id:
    type:
      - number
      - 'null'
    description: The ID of the lost reason, required once the item is in a `lost` stage
  conversation_id:
    type:
      - number
      - 'null'
    description: The ID of the linked conversation, if any
  contact:
    type: object
    properties:
      id:
        type: number
      name:
        type: string
      email:
        type:
          - string
          - 'null'
      phone_number:
        type:
          - string
          - 'null'
      avatar_url:
        type: string
  # The partial emits an explicit null for each of these when the association is absent, so the
  # plain $ref (which forbids null) never matched an unassigned card - the common case.
  assignee:
    oneOf:
      - $ref: '#/components/schemas/agent'
      - type: 'null'
  team:
    oneOf:
      - $ref: '#/components/schemas/team'
      - type: 'null'
  pipeline_lost_reason:
    oneOf:
      - $ref: '#/components/schemas/pipeline_lost_reason'
      - type: 'null'
  label_list:
    type: array
    items:
      type: string
    description: The labels applied to this item
  custom_attributes:
    type: object
    description: Custom attribute values set on this item, keyed by attribute key
  overdue_tasks_count:
    type: number
    description: Number of pending tasks on this item whose due date has passed. Drives the overdue badge on the card
  created_at:
    type: number
    description: >-
      When the item was created, as a Unix timestamp in seconds. Note this is an integer, not an
      ISO-8601 string - the serializer emits `created_at.to_i`
  updated_at:
    type: number
    description: >-
      When the item was last updated, as a Unix timestamp in seconds. Note this is an integer, not
      an ISO-8601 string - the serializer emits `updated_at.to_i`
additionalProperties: false
