# Manual candidate validation and GHCR publication. No automatic deployment.
# No production credentials, Portainer connection or automatic deployment.
name: Kanban candidate - tests and custom image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a NEW candidate image to GHCR after tests pass (does not deploy)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kanban-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  TZ: UTC

jobs:
  javascript:
    name: Kanban and reconnect JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST: 'true'
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Node version from repository
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the exact pnpm version declared by the repository
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").packageManager.match(/^pnpm@([^+]+)/)[1]')"
          npm install --global "pnpm@$version" --ignore-scripts
          pnpm --version
      - name: Install dependencies without changing the lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint the changed JavaScript
        run: >-
          pnpm exec eslint
          app/javascript/dashboard/helper/ReconnectService.js
          app/javascript/dashboard/helper/specs/ReconnectService.spec.js
          app/javascript/dashboard/store/modules/kanban/actions.js
          app/javascript/dashboard/store/modules/kanban/specs/actions.spec.js
      - name: Run the three relevant suites (58 tests at the reviewed revision)
        run: >-
          pnpm exec vitest run --no-cache --no-coverage --minWorkers=1 --maxWorkers=2
          app/javascript/dashboard/helper/specs/ReconnectService.spec.js
          app/javascript/dashboard/store/modules/kanban/specs/actions.spec.js
          app/javascript/dashboard/store/modules/kanban/specs/getters.spec.js
      - name: Confirm manifests and lockfile were not changed
        run: git diff --exit-code -- package.json pnpm-lock.yaml

  ruby:
    name: Pipeline model and ActionCable listener Ruby
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILS_ENV: test
      NODE_ENV: test
      BUNDLE_FROZEN: 'true'
      BUNDLE_WITHOUT: ''
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/chatboot_kanban_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DATABASE: chatboot_kanban_ci
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ci-only-password
      REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY_BASE: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      FRONTEND_URL: http://localhost:3000
      ENABLE_ACCOUNT_SIGNUP: 'false'
      RAILS_LOG_TO_STDOUT: 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chatboot_kanban_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatboot_kanban_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Native test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libpq-dev libvips42t64 libyaml-dev pkg-config cmake imagemagick
      - name: Ruby and Bundler from repository lockfiles
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1 branch, pinned commit
        with:
          # Omitted ruby-version makes the action read .ruby-version (3.4.4).
          bundler: Gemfile.lock
          bundler-cache: true
      - name: Refuse any database outside the disposable test service
        shell: bash
        run: |
          set -euo pipefail
          ruby -ruri -e 'u = URI(ENV.fetch("DATABASE_URL")); abort "Unsafe test database" unless ENV["RAILS_ENV"] == "test" && u.host == "127.0.0.1" && u.path == "/chatboot_kanban_ci"'
      - name: Prepare only the isolated test database
        run: bundle exec rails db:prepare
      - name: Check Ruby syntax
        run: bundle exec ruby -c app/models/pipeline_item.rb
      - name: Test model broadcasts and listener account/member scope
        run: >-
          bundle exec rspec
          spec/models/pipeline_item_spec.rb
          spec/listeners/action_cable_listener_spec.rb
          --format progress
      - name: Confirm dependency lockfile was not changed
        run: git diff --exit-code -- Gemfile Gemfile.lock

  image:
    name: Build a new immutable custom-image candidate
    needs: [javascript, ruby]
    if: github.repository == 'hamiltonrurik-a11y/chatboot_hamilton'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # This is the ONLY job with package-write permission. No repository write permission.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      tag: ${{ steps.metadata.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact tested commit, keeping Git metadata and no stored token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm path context and repository versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          test -d .git
          test -z "$(git config --local --get-regexp 'http\..*\.extraheader' || true)"
          node_version="$(tr -d '\r\n' < .nvmrc)"
          pnpm_version="$(node -p 'require("./package.json").packageManager.match(/^pnpm@([^+]+)/)[1]')"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="kanban-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=$pnpm_version" >> "$GITHUB_OUTPUT"
      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to the same repository's GHCR package
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production assets and optionally publish the new candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # Explicit PATH context retains .git for Dockerfile's git rev-parse HEAD.
          # Never switch to default Git context without keeping Git metadata explicitly.
          context: .
          file: docker/Dockerfile
          # Confirmed from Portainer Swarm node OSInformation: linux x86_64.
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            NODE_VERSION=${{ steps.metadata.outputs.node_version }}
            PNPM_VERSION=${{ steps.metadata.outputs.pnpm_version }}
            RAILS_ENV=production
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Chatboot Hamilton Kanban candidate
          cache-from: type=gha,scope=chatboot-kanban-amd64
          cache-to: type=gha,mode=max,scope=chatboot-kanban-amd64
      - name: Record the deployable digest; do not deploy
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG: ${{ steps.metadata.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ inputs.publish }}
        run: |
          {
            echo "## Kanban candidate"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Tag: \`$IMAGE:$TAG\`"
            echo "Digest: \`$DIGEST\`"
            echo "Published: $PUBLISHED"
            if [ "$PUBLISHED" = true ]; then
              echo "Reference for BOTH app and sidekiq after review: \`$IMAGE@$DIGEST\`"
            else
              echo "Dry build only. No image was published and production was untouched."
            fi
            echo "No latest tag was changed. No Portainer update was performed."
          } >> "$GITHUB_STEP_SUMMARY"
